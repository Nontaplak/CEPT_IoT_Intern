<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Energy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .login-header h3 {
            margin: 0;
            font-weight: 300;
            font-size: 1.8rem;
        }
        
        .login-header .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .login-form {
            padding: 2rem;
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-login:disabled {
            opacity: 0.6;
            transform: none;
        }
        
        .signup-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }
        
        .signup-link:hover {
            color: #764ba2;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            font-weight: 500;
        }
        
        .demo-info {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid #667eea;
        }
        
        .demo-info h6 {
            color: #667eea;
            margin-bottom: 0.5rem;
        }
        
        .demo-info small {
            color: #6c757d;
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 1rem;
                border-radius: 15px;
            }
            
            .login-header, .login-form {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container">
                    <div class="login-header">
                        <div class="icon">⚡</div>
                        <h3>เข้าสู่ระบบ</h3>
                        <p class="mb-0">Energy Dashboard</p>
                    </div>
                    
                    <div class="login-form">
                        <form id="loginForm">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="username" placeholder="ชื่อผู้ใช้" required>
                                <label for="username">👤 ชื่อผู้ใช้</label>
                            </div>
                            
                            <div class="form-floating">
                                <input type="password" class="form-control" id="password" placeholder="รหัสผ่าน" required>
                                <label for="password">🔒 รหัสผ่าน</label>
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-login">
                                เข้าสู่ระบบ
                            </button>
                        </form>
                        <!--
                        <div class="text-center mt-3">
                            <a href="#" id="signupLink" class="signup-link">ยังไม่มีบัญชี? สมัครสมาชิก</a>
                        </div>
                        -->
                        <div id="loginMessage" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Login Manager Class
        class LoginManager {
            constructor() {
                this.init();
            }

            init() {
                this.checkExistingAuth();
                this.setupEventListeners();
            }

            checkExistingAuth() {
                const token = this.getStoredToken();
                if (token && window.location.pathname === '/login') {
                    window.location.href = '/';
                }
            }

            getStoredToken() {
                try {
                    return localStorage.getItem('token');
                } catch (error) {
                    console.warn('localStorage not available:', error);
                    return null;
                }
            }

            setStoredToken(token) {
                try {
                    if (token) {
                        localStorage.setItem('token', token);
                    } else {
                        localStorage.removeItem('token');
                    }
                } catch (error) {
                    console.warn('localStorage not available:', error);
                }
            }

            setupEventListeners() {
                const loginForm = document.getElementById('loginForm');
                const signupLink = document.getElementById('signupLink');

                if (loginForm) {
                    loginForm.addEventListener('submit', (e) => {
                        e.preventDefault();
                        this.handleLogin();
                    });
                }

                if (signupLink) {
                    signupLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        this.showMessage('ฟีเจอร์สมัครสมาชิกยังไม่เปิดใช้งาน', 'warning');
                    });
                }

                // Handle Enter key
                const passwordField = document.getElementById('password');
                if (passwordField) {
                    passwordField.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.handleLogin();
                        }
                    });
                }
            }

            async handleLogin() {
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const submitButton = document.querySelector('#loginForm button[type="submit"]');

                if (!usernameInput || !passwordInput || !submitButton) {
                    this.showMessage('ไม่พบองค์ประกอบของแบบฟอร์ม', 'danger');
                    return;
                }

                const username = usernameInput.value.trim();
                const password = passwordInput.value;

                if (!username || !password) {
                    this.showMessage('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'warning');
                    return;
                }

                // Show loading state
                const originalText = submitButton.textContent;
                submitButton.disabled = true;
                submitButton.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังเข้าสู่ระบบ...';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        this.setStoredToken(data.token);
                        this.showMessage('เข้าสู่ระบบสำเร็จ กำลังเปลี่ยนหน้า...', 'success');
                        
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1500);
                    } else {
                        const errorMessage = data.error || 'เกิดข้อผิดพลาดในการเข้าสู่ระบบ';
                        this.showMessage(errorMessage, 'danger');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    this.showMessage('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์', 'danger');
                } finally {
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalText;
                }
            }

            showMessage(message, type) {
                const messageDiv = document.getElementById('loginMessage');
                if (!messageDiv) return;

                messageDiv.innerHTML = '';

                const alertDiv = document.createElement('div');
                alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
                alertDiv.role = 'alert';
                alertDiv.innerHTML = `
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                `;

                messageDiv.appendChild(alertDiv);

                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.remove();
                    }
                }, 5000);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            try {
                window.loginManager = new LoginManager();
            } catch (error) {
                console.error('Failed to initialize login manager:', error);
            }
        });
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>
